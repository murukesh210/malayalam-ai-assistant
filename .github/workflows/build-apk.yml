name: Build Debug APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compile app-debug.apk (Java 21 + AGP 9.4.1 + Gradle 9.8.2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Verify JAVA_HOME & Active JDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version

      - name: Setup Gradle 9.8.2 & Dependency Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Bootstrap Gradle 9.8.2 Wrapper Jar & Verify Wrapper JVM
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.8.2 --no-daemon
          fi
          chmod +x ./gradlew
          ./gradlew --version --no-daemon

      - name: Pre-fetch sherpa-onnx Android AAR (CPU-only ONNX ASR)
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar" \
            -o app/libs/sherpa-onnx.aar \
          || curl -fL --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.23/sherpa-onnx-1.12.23.aar" \
            -o app/libs/sherpa-onnx.aar || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload app-debug.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
