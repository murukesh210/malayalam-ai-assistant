name: Build Debug APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compile app-debug.apk (Java 17 + SDK 35)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1 & Dependency Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Bootstrap Gradle Wrapper Jar if Absent
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1 --no-daemon
          fi
          chmod +x ./gradlew

      - name: Pre-fetch sherpa-onnx Android AAR (CPU-only ONNX ASR)
        run: |
          mkdir -p app/libs
          LATEST_AAR_URL=$(curl -fsSL https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/latest \
            | jq -r '.assets[] | select(.name | test("^sherpa-onnx-[0-9.]+\\.aar$")) | .browser_download_url' \
            | head -n 1 || true)
          if [ -n "$LATEST_AAR_URL" ] && [ "$LATEST_AAR_URL" != "null" ]; then
            echo "Downloading latest sherpa-onnx AAR: $LATEST_AAR_URL"
            curl -fL --retry 3 "$LATEST_AAR_URL" -o app/libs/sherpa-onnx.aar
          else
            echo "Falling back to pinned sherpa-onnx AAR"
            curl -fL --retry 3 \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.23/sherpa-onnx-1.12.23.aar" \
              -o app/libs/sherpa-onnx.aar || true
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload app-debug.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
